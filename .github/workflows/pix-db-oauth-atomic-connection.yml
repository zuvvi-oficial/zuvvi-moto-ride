name: PIX DB OAuth Atomic Connection

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pix-db-oauth-atomic-connection.yml"
      - "docs/pix/sql/PIX08_OAUTH_ATOMIC_CONNECTION.sql.template"
      - "docs/pix/sql/PIX08D_OAUTH_SAFE_DISCONNECT.sql.template"
      - "scripts/pix/pix-mercadopago-oauth-functions.test.ts"
      - "scripts/pix/pix-mercadopago-oauth-flow.test.ts"
      - "scripts/pix/pix-mercadopago-account.test.ts"
      - "src/components/motorista/MercadoPagoConnect.tsx"
      - "src/routes/motorista.mercadopago-callback.tsx"
      - "src/lib/motorista.functions.ts"
      - "src/lib/pix-mercadopago-account.server.ts"
      - "src/lib/pix-mercadopago-oauth-input.ts"
      - "src/lib/pix-mercadopago-oauth-runtime.server.ts"
      - "src/lib/pix-mercadopago-oauth.functions.ts"
      - "src/lib/pix-mercadopago-oauth-flow.server.ts"
      - "src/lib/pix-mercadopago-oauth-supabase.server.ts"
      - "supabase/migrations/*_pix_oauth_atomic_connection.sql"
      - "supabase/migrations/*_pix_oauth_safe_disconnect.sql"
      - "supabase/tests/pix_08_oauth_atomic_connection.sql"
      - "supabase/tests/pix_08d_oauth_safe_disconnect.sql"

permissions:
  contents: read

concurrency:
  group: pix-db-oauth-atomic-connection-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pix-08a-oauth-atomic-connection:
    name: Testar conexão, status e desconexão OAuth seguros
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_CLI_VERSION: 2.115.0
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - name: Checkout da branch do Pix
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Conferir Docker
        run: docker version

      - name: Instalar Supabase CLI fixada
        run: npx --yes supabase@${SUPABASE_CLI_VERSION} --version

      - name: Validar migrations OAuth versionadas e gerar nome oficial PIX-08D
        shell: bash
        run: |
          set -euo pipefail
          expected_pix08_path="supabase/migrations/20260825021917_pix_oauth_atomic_connection.sql"
          mapfile -t pix08_paths < <(git ls-files 'supabase/migrations/*_pix_oauth_atomic_connection.sql')
          test "${#pix08_paths[@]}" = "1"
          test "${pix08_paths[0]}" = "${expected_pix08_path}"
          cmp -s docs/pix/sql/PIX08_OAUTH_ATOMIC_CONNECTION.sql.template "${expected_pix08_path}"

          pix08d_path="$(find supabase/migrations -maxdepth 1 -type f -name '*_pix_oauth_safe_disconnect.sql' -print -quit)"
          if [ -z "${pix08d_path}" ]; then
            npx --yes supabase@${SUPABASE_CLI_VERSION} migration new pix_oauth_safe_disconnect
            pix08d_path="$(find supabase/migrations -maxdepth 1 -type f -name '*_pix_oauth_safe_disconnect.sql' -print -quit)"
            cp docs/pix/sql/PIX08D_OAUTH_SAFE_DISCONNECT.sql.template "${pix08d_path}"
            echo "MIGRATION_GENERATED=${pix08d_path}"
          else
            cmp -s docs/pix/sql/PIX08D_OAUTH_SAFE_DISCONNECT.sql.template "${pix08d_path}"
            echo "MIGRATION_VERSIONED=${pix08d_path}"
          fi
          test -n "${pix08d_path}"

          cp supabase/migrations/20260824222419_unicidade_conta_mercado_pago_motorista.sql /tmp/pix_07r.sql
          cp supabase/migrations/20260824233357_pix_oauth_credentials_private.sql /tmp/pix_01.sql
          cp supabase/migrations/20260824234933_pix_attempts_webhook.sql /tmp/pix_02.sql
          cp supabase/migrations/20260825001055_pix_aggregate_integrity.sql /tmp/pix_03.sql
          cp supabase/migrations/20260825004851_pix_oauth_state_pkce.sql /tmp/pix_04.sql
          cp "${expected_pix08_path}" /tmp/pix_08.sql
          cp "${pix08d_path}" /tmp/pix_08d.sql
          echo "MIGRATION_VERSIONED=${expected_pix08_path}"

      - name: Isolar migrations preexistentes no runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zuvvi_migrations_preexistentes
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' \
            -exec mv {} /tmp/zuvvi_migrations_preexistentes/ \;
          test -z "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"

      - name: Iniciar Supabase local descartável
        run: >-
          npx --yes supabase@${SUPABASE_CLI_VERSION} start
          --exclude studio,imgproxy,mailpit,logflare,vector,edge-runtime

      - name: Aplicar fixtures e fundações Pix até PIX-08D
        shell: bash
        run: |
          set -euo pipefail
          migration_table_exists="$(psql "${LOCAL_DB_URL}" -Atc \
            "select to_regclass('supabase_migrations.schema_migrations') is not null")"
          if [ "${migration_table_exists}" = "t" ]; then
            migration_count="$(psql "${LOCAL_DB_URL}" -Atc \
              'select count(*) from supabase_migrations.schema_migrations')"
            test "${migration_count}" = "0"
          fi
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/fixtures/pix_01_prerequisites.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/fixtures/pix_07r_prerequisites.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -c \
            'alter table public.motoristas add column updated_at timestamptz not null default now()'
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -c \
            'grant select, update on table public.motoristas to service_role'
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/pix_07r.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/pix_01.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/pix_08.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/fixtures/pix_02_prerequisites.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/tests/fixtures/pix_03_prerequisites.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/pix_02.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/pix_03.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/pix_04.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 <<'SQL'
          create type public.corrida_status as enum (
            'solicitada','buscando_motorista','aceita','motorista_a_caminho',
            'motorista_chegou','em_andamento','concluida','cancelada','sem_motorista'
          );
          create type public.pagamento_status as enum ('pendente','pago','falhou','estornado');
          create table public.corridas (
            id uuid primary key,
            passageiro_id uuid not null,
            motorista_id uuid references public.motoristas(id),
            status public.corrida_status not null,
            forma_pagamento public.forma_pagamento not null
          );
          alter table public.pagamentos
            add column status public.pagamento_status not null default 'pendente';
          grant select on table public.corridas, public.pagamentos to service_role;
          SQL
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/pix_08d.sql

      - name: Executar testes exclusivos PIX-08A e PIX-08D
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@${SUPABASE_CLI_VERSION} test db supabase/tests/pix_08_oauth_atomic_connection.sql --local
          npx --yes supabase@${SUPABASE_CLI_VERSION} test db supabase/tests/pix_08d_oauth_safe_disconnect.sql --local

      - name: Repetir regressão pgTAP PIX-01 a PIX-04 e PIX-07R
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@${SUPABASE_CLI_VERSION} test db supabase/tests/pix_01_oauth_credentials.sql --local
          npx --yes supabase@${SUPABASE_CLI_VERSION} test db supabase/tests/pix_02_attempts_webhook.sql --local
          npx --yes supabase@${SUPABASE_CLI_VERSION} test db supabase/tests/pix_03_integridade_agregada.sql --local
          npx --yes supabase@${SUPABASE_CLI_VERSION} test db supabase/tests/pix_04_oauth_state_pkce.sql --local
          npx --yes supabase@${SUPABASE_CLI_VERSION} test db supabase/tests/pix_07r_conta_mercado_pago_unica.sql --local

      - name: Lint e advisors do banco local
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@${SUPABASE_CLI_VERSION} db lint --local --schema private,public --level error --fail-on error
          npx --yes supabase@${SUPABASE_CLI_VERSION} db advisors --local --type security
          npx --yes supabase@${SUPABASE_CLI_VERSION} db advisors --local --type performance

      - name: Instalar Bun fixado
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Instalar dependências sem alterar o lockfile
        run: bun install --frozen-lockfile

      - name: Repetir PIX-05, PIX-06 e testar PIX-08B, PIX-08C e conta segura
        shell: bash
        run: |
          set -euo pipefail
          bunx tsc \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022,DOM \
            --types node \
            --strict \
            --skipLibCheck \
            --outDir /tmp/pix-oauth-regression \
            src/lib/pix-oauth-crypto.server.ts \
            scripts/pix/pix-oauth-crypto.test.ts \
            src/lib/pix-mercadopago-oauth.server.ts \
            scripts/pix/pix-mercadopago-oauth.test.ts \
            src/lib/pix-mercadopago-oauth-flow.server.ts \
            src/lib/pix-mercadopago-oauth-supabase.server.ts \
            scripts/pix/pix-mercadopago-oauth-flow.test.ts \
            src/lib/pix-mercadopago-oauth-input.ts \
            src/lib/pix-mercadopago-oauth-runtime.server.ts \
            scripts/pix/pix-mercadopago-oauth-functions.test.ts \
            src/lib/pix-mercadopago-account.server.ts \
            scripts/pix/pix-mercadopago-account.test.ts
          node --test /tmp/pix-oauth-regression/scripts/pix/pix-oauth-crypto.test.js
          node --test /tmp/pix-oauth-regression/scripts/pix/pix-mercadopago-oauth.test.js
          node --test /tmp/pix-oauth-regression/scripts/pix/pix-mercadopago-oauth-flow.test.js
          node --test /tmp/pix-oauth-regression/scripts/pix/pix-mercadopago-oauth-functions.test.js
          node --test /tmp/pix-oauth-regression/scripts/pix/pix-mercadopago-account.test.js

      - name: Verificar código e build integral
        shell: bash
        run: |
          set -euo pipefail
          bunx eslint src/lib/pix-oauth-crypto.server.ts src/lib/pix-mercadopago-oauth.server.ts src/lib/pix-mercadopago-oauth-flow.server.ts src/lib/pix-mercadopago-oauth-supabase.server.ts src/lib/pix-mercadopago-oauth-input.ts src/lib/pix-mercadopago-oauth-runtime.server.ts src/lib/pix-mercadopago-oauth.functions.ts src/lib/pix-mercadopago-account.server.ts scripts/pix/pix-oauth-crypto.test.ts scripts/pix/pix-mercadopago-oauth.test.ts scripts/pix/pix-mercadopago-oauth-flow.test.ts scripts/pix/pix-mercadopago-oauth-functions.test.ts scripts/pix/pix-mercadopago-account.test.ts
          bunx tsc --noEmit
          bun run build

      - name: Provar ponte OAuth segura limitada à interface autorizada
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t runtime_consumers < <(grep -Rl "pix-mercadopago-oauth-runtime.server" src \
            --include='*.ts' --include='*.tsx' \
            --exclude='pix-mercadopago-oauth-runtime.server.ts' | sort)
          test "${#runtime_consumers[@]}" = "1"
          test "${runtime_consumers[0]}" = "src/lib/pix-mercadopago-oauth.functions.ts"

          mapfile -t oauth_function_consumers < <(grep -Rl "pix-mercadopago-oauth.functions" src \
            --include='*.ts' --include='*.tsx' \
            --exclude='pix-mercadopago-oauth.functions.ts' | sort)
          test "${#oauth_function_consumers[@]}" = "2"
          test "${oauth_function_consumers[0]}" = "src/components/motorista/MercadoPagoConnect.tsx"
          test "${oauth_function_consumers[1]}" = "src/routes/motorista.mercadopago-callback.tsx"

          grep -Fq "iniciarConexaoMercadoPagoPixSegura" src/components/motorista/MercadoPagoConnect.tsx
          grep -Fq "getStatusConexaoMercadoPagoPixSegura" src/components/motorista/MercadoPagoConnect.tsx
          grep -Fq "desconectarMercadoPagoPixSeguro" src/components/motorista/MercadoPagoConnect.tsx
          grep -Fq "concluirConexaoMercadoPagoPixSegura" src/routes/motorista.mercadopago-callback.tsx
          grep -Fq "getPixMercadoPagoSecureConnectionStatus" src/lib/motorista.functions.ts
          grep -Fq 'if (ride.forma_pagamento === "pix" && !pixConectado) return false;' src/lib/motorista.functions.ts
          if grep -F 'ride.forma_pagamento === "pix" && !motorista.conta_mercado_pago_id' src/lib/motorista.functions.ts; then
            echo "Ofertas Pix ainda confiam apenas no identificador público do Mercado Pago"
            exit 1
          fi
          if grep -F "motorista-pagamento.functions" src/components/motorista/MercadoPagoConnect.tsx; then
            echo "Interface Mercado Pago ainda depende do fluxo público antigo"
            exit 1
          fi
          if grep -R "zuvvi_mp_oauth_state" src --include='*.ts' --include='*.tsx'; then
            echo "State OAuth ainda persistido ou lido no navegador"
            exit 1
          fi
          if grep -R "PIX_OAUTH_ENCRYPTION_KEY\|client-secret-test\|access-token-test\|refresh-token-test" .output/public; then
            echo "Material OAuth sensível encontrado no bundle público"
            exit 1
          fi

      - name: Provar dependência QR isolada da Etapa 5
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const atual = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const base = JSON.parse(execFileSync('git', ['show', 'origin/main:package.json'], { encoding: 'utf8' }));

          if (atual.dependencies?.['qrcode.react'] !== '4.2.0') {
            throw new Error('qrcode.react deve permanecer fixado em 4.2.0');
          }
          delete atual.dependencies['qrcode.react'];
          if (JSON.stringify(atual) !== JSON.stringify(base)) {
            throw new Error('package.json mudou além da dependência QR autorizada');
          }
          NODE

          lock_patch="$(git diff --unified=0 origin/main -- bun.lock)"
          deleted_lock_lines="$(printf '%s\n' "$lock_patch" | grep '^-' | grep -v '^---' || true)"
          added_lock_lines="$(printf '%s\n' "$lock_patch" | grep '^+' | grep -v '^+++' || true)"
          added_count="$(printf '%s\n' "$added_lock_lines" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ -n "$deleted_lock_lines" ] || [ "$added_count" -ne 3 ]; then
            echo "bun.lock mudou além da entrada QR autorizada"
            git diff origin/main -- bun.lock
            exit 1
          fi
          grep -q '"qrcode.react": "4.2.0"' bun.lock
          grep -q '"qrcode.react": \["qrcode.react@4.2.0"' bun.lock
          test "$(sha256sum src/lib/motorista-pagamento.functions.ts | cut -d ' ' -f1)" = "fcafe924a0b96f999625bbb0e48b961df8ed895bc1b331a3f79fb29501ad81d3"
          if ! git diff --quiet -- package.json bun.lock; then
            echo "package.json ou bun.lock foram alterados pelo runner"
            git diff -- package.json bun.lock
            exit 1
          fi

      - name: Descartar stack local
        if: always()
        run: npx --yes supabase@${SUPABASE_CLI_VERSION} stop --no-backup
