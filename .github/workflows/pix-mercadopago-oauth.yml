name: PIX Mercado Pago OAuth Client

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pix-mercadopago-oauth.yml"
      - "src/lib/pagamento.server.ts"
      - "src/lib/pix-mercadopago-oauth.functions.ts"
      - "src/lib/pix-mercadopago-oauth-runtime.server.ts"
      - "src/lib/pix-mercadopago-oauth.server.ts"
      - "src/lib/pix-payment-sync.server.ts"
      - "scripts/pix/pix-mercadopago-oauth.test.ts"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: pix-mercadopago-oauth-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pix-06-mercadopago-oauth:
    name: Testar cliente OAuth Mercado Pago exclusivamente no servidor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout da branch do Pix
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Instalar Bun fixado
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Instalar dependências sem alterar o lockfile
        run: bun install --frozen-lockfile

      - name: Compilar somente cliente e testes PIX-06
        run: >-
          bunx tsc
          --target ES2022
          --module NodeNext
          --moduleResolution NodeNext
          --lib ES2022,DOM
          --types node
          --strict
          --skipLibCheck
          --outDir /tmp/pix-mercadopago-oauth
          src/lib/pix-mercadopago-oauth.server.ts
          scripts/pix/pix-mercadopago-oauth.test.ts

      - name: Executar testes OAuth sem rede real
        run: node --test /tmp/pix-mercadopago-oauth/scripts/pix/pix-mercadopago-oauth.test.js

      - name: Repetir regressão criptográfica PIX-05
        run: |
          bunx tsc \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022,DOM \
            --types node \
            --strict \
            --skipLibCheck \
            --outDir /tmp/pix-oauth-crypto \
            src/lib/pix-oauth-crypto.server.ts \
            scripts/pix/pix-oauth-crypto.test.ts
          node --test /tmp/pix-oauth-crypto/scripts/pix/pix-oauth-crypto.test.js

      - name: Verificar ESLint
        run: bunx eslint src/lib/pix-mercadopago-oauth.server.ts scripts/pix/pix-mercadopago-oauth.test.ts

      - name: Verificar TypeScript integral
        run: bunx tsc --noEmit

      - name: Executar build de produção
        run: bun run build

      - name: Provar isolamento do cliente no servidor
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "pix-mercadopago-oauth.server" src \
            --include='*.ts' --include='*.tsx' \
            --exclude='pix-mercadopago-oauth.server.ts' \
            --exclude='pix-mercadopago-oauth-flow.server.ts' \
            --exclude='pix-mercadopago-oauth-runtime.server.ts' \
            --exclude='pix-mercadopago-oauth.functions.ts' \
            --exclude='pix-payment-sync.server.ts' \
            --exclude='pagamento.server.ts'; then
            echo "O cliente OAuth foi importado por código existente do aplicativo"
            exit 1
          fi
          if grep -R "api.mercadopago.com/oauth/token" .output/public; then
            echo "Endpoint OAuth encontrado no bundle público"
            exit 1
          fi

      - name: Provar dependência QR isolada da Etapa 5
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const atual = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const base = JSON.parse(execFileSync('git', ['show', 'origin/main:package.json'], { encoding: 'utf8' }));

          if (atual.dependencies?.['qrcode.react'] !== '4.2.0') {
            throw new Error('qrcode.react deve permanecer fixado em 4.2.0');
          }
          delete atual.dependencies['qrcode.react'];
          // A Etapa 5 introduziu qrcode.react comparando contra um main que
          // ainda não tinha a dependência. Agora que o main já a carrega
          // permanentemente, o lado "base" também precisa remover a mesma
          // chave antes de comparar — senão a prova nunca mais bate, mesmo
          // quando a PR atual não toca em package.json.
          if (base.dependencies) delete base.dependencies['qrcode.react'];

          if (atual.scripts?.build !== 'vite build && bun scripts/build/publicar-service-worker.ts') {
            throw new Error('scripts.build deve publicar o service worker após vite build (ZV 08)');
          }
          delete atual.scripts.build;
          // A ZV 08 do plano de fechamento mudou scripts.build permanentemente
          // para copiar sw.js/workbox-*.js ao diretório final de cada preset
          // depois que `vite build` (incluindo o empacotamento do Nitro) já
          // terminou — sem isso o service worker nunca chega ao diretório
          // publicado e o registro de push falha silenciosamente. O lado
          // "base" também precisa remover a mesma chave antes de comparar,
          // pelo mesmo motivo do qrcode.react acima.
          if (base.scripts) delete base.scripts.build;

          // Fora de dependencies/devDependencies (scripts, name, etc.), nada
          // pode mudar sem uma decisão consciente nesta checagem.
          const { dependencies: atualDeps, devDependencies: atualDevDeps, ...atualRest } = atual;
          const { dependencies: baseDeps, devDependencies: baseDevDeps, ...baseRest } = base;
          if (JSON.stringify(atualRest) !== JSON.stringify(baseRest)) {
            throw new Error('package.json mudou fora de dependencies/devDependencies');
          }

          // Dentro de dependencies/devDependencies, a limpeza do Netlify (PR #133)
          // mostrou que exigir baseline idêntico para sempre obriga a reeditar
          // este arquivo a cada limpeza de dependência morta legítima. A regra
          // permanente vira: remover uma dependência nunca precisa de permissão
          // especial (só reduz superfície de ataque); adicionar ou trocar a
          // versão de uma dependência existente sempre precisa — isso continua
          // bloqueado abaixo.
          function assertOnlyRemovals(baseObj = {}, atualObj = {}, label) {
            for (const [key, value] of Object.entries(atualObj)) {
              if (baseObj[key] !== value) {
                throw new Error(
                  `${label} mudou "${key}" sem autorização (era ${JSON.stringify(baseObj[key])}, agora ${JSON.stringify(value)})`,
                );
              }
            }
          }
          assertOnlyRemovals(baseDeps, atualDeps, 'dependencies');
          assertOnlyRemovals(baseDevDeps, atualDevDeps, 'devDependencies');
          NODE

          # A Etapa 5 introduziu qrcode.react no bun.lock comparando contra um
          # main que ainda não tinha a entrada, aceitando um diff de exatamente
          # +3 linhas. Agora que o main já carrega essa entrada permanentemente,
          # nenhuma PR legítima precisa mais tocar em bun.lock por causa dela —
          # e aceitar "+3 linhas quaisquer" (sem checar o conteúdo) deixaria
          # passar 3 linhas arbitrárias não relacionadas à entrada QR original.
          #
          # A remoção do Netlify (PR #133) apagou ~400 linhas de bun.lock, e a
          # limpeza de UI morta (PR #135) mais umas 80. Em vez de exigir diff
          # vazio ou enumerar cada linha removida — travando a checagem pra
          # sempre reeditar este arquivo a cada limpeza de dependência morta —
          # a regra é: só remoção de linha inteira é permitida (nunca adição,
          # nunca edição parcial de uma linha existente, o que poderia
          # esconder uma troca de URL/hash disfarçada de remoção). Isso
          # mantém a checagem consciente (nenhuma dependência nova ou
          # modificada passa despercebida) sem precisar de exceção nova a
          # cada PR de limpeza. Duas formas de linha podem ser removidas:
          # uma entrada inteira de "packages" (array numa linha só) ou uma
          # entrada de dependency/devDependency do workspace ("pkg": "versão").
          lock_patch="$(git diff --unified=0 origin/main -- bun.lock)"
          if [ -n "$lock_patch" ]; then
            added_lines="$(echo "$lock_patch" | grep -c '^+[^+]' || true)"
            if [ "$added_lines" -gt 0 ]; then
              echo "bun.lock ganhou linha(s) nova(s) além de remoções de dependência"
              git diff origin/main -- bun.lock
              exit 1
            fi
            bad_removals="$(echo "$lock_patch" | grep '^-[^-]' | grep -Ev '^-    "[^"]+": \[|^-        "[^"]+": "[^"]*",?$' || true)"
            if [ -n "$bad_removals" ]; then
              echo "bun.lock removeu algo que não é uma entrada de pacote inteira nem a dependência do Netlify"
              echo "$bad_removals"
              exit 1
            fi
          fi
          if grep -q '@netlify/vite-plugin-tanstack-start' bun.lock; then
            echo "bun.lock ainda referencia o Netlify"
            exit 1
          fi
          grep -q '"qrcode.react": "4.2.0"' bun.lock
          grep -q '"qrcode.react": \["qrcode.react@4.2.0"' bun.lock
          test -z "$(git status --porcelain)"
