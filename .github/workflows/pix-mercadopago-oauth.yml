name: PIX Mercado Pago OAuth Client

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pix-mercadopago-oauth.yml"
      - "src/lib/pagamento.server.ts"
      - "src/lib/pix-mercadopago-oauth.functions.ts"
      - "src/lib/pix-mercadopago-oauth-runtime.server.ts"
      - "src/lib/pix-mercadopago-oauth.server.ts"
      - "src/lib/pix-payment-sync.server.ts"
      - "scripts/pix/pix-mercadopago-oauth.test.ts"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: pix-mercadopago-oauth-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pix-06-mercadopago-oauth:
    name: Testar cliente OAuth Mercado Pago exclusivamente no servidor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout da branch do Pix
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Instalar Bun fixado
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Instalar dependências sem alterar o lockfile
        run: bun install --frozen-lockfile

      - name: Compilar somente cliente e testes PIX-06
        run: >-
          bunx tsc
          --target ES2022
          --module NodeNext
          --moduleResolution NodeNext
          --lib ES2022,DOM
          --types node
          --strict
          --skipLibCheck
          --outDir /tmp/pix-mercadopago-oauth
          src/lib/pix-mercadopago-oauth.server.ts
          scripts/pix/pix-mercadopago-oauth.test.ts

      - name: Executar testes OAuth sem rede real
        run: node --test /tmp/pix-mercadopago-oauth/scripts/pix/pix-mercadopago-oauth.test.js

      - name: Repetir regressão criptográfica PIX-05
        run: |
          bunx tsc \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022,DOM \
            --types node \
            --strict \
            --skipLibCheck \
            --outDir /tmp/pix-oauth-crypto \
            src/lib/pix-oauth-crypto.server.ts \
            scripts/pix/pix-oauth-crypto.test.ts
          node --test /tmp/pix-oauth-crypto/scripts/pix/pix-oauth-crypto.test.js

      - name: Verificar ESLint
        run: bunx eslint src/lib/pix-mercadopago-oauth.server.ts scripts/pix/pix-mercadopago-oauth.test.ts

      - name: Verificar TypeScript integral
        run: bunx tsc --noEmit

      - name: Executar build de produção
        run: bun run build

      - name: Provar isolamento do cliente no servidor
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "pix-mercadopago-oauth.server" src \
            --include='*.ts' --include='*.tsx' \
            --exclude='pix-mercadopago-oauth.server.ts' \
            --exclude='pix-mercadopago-oauth-flow.server.ts' \
            --exclude='pix-mercadopago-oauth-runtime.server.ts' \
            --exclude='pix-mercadopago-oauth.functions.ts' \
            --exclude='pix-payment-sync.server.ts' \
            --exclude='pagamento.server.ts'; then
            echo "O cliente OAuth foi importado por código existente do aplicativo"
            exit 1
          fi
          if grep -R "api.mercadopago.com/oauth/token" .output/public; then
            echo "Endpoint OAuth encontrado no bundle público"
            exit 1
          fi

      - name: Provar ausência de dependências não autorizadas
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          # qrcode.react@4.2.0 foi a única dependência autorizada a entrar em
          # package.json/bun.lock (Etapa 5) e já está permanentemente em main
          # desde então — segue conferido aqui, mas como piso, não como algo
          # isolado a esta etapa.
          grep -q '"qrcode.react": "4.2.0"' package.json
          grep -q '"qrcode.react": "4.2.0"' bun.lock
          grep -q '"qrcode.react": \["qrcode.react@4.2.0"' bun.lock
          if ! git diff --quiet origin/main -- package.json bun.lock; then
            echo "package.json/bun.lock divergiu de origin/main sem autorização explícita nesta etapa"
            git diff origin/main -- package.json bun.lock
            exit 1
          fi
          if ! git diff --quiet -- package.json bun.lock; then
            echo "package.json ou bun.lock foram alterados pelo runner"
            git diff -- package.json bun.lock
            exit 1
          fi
