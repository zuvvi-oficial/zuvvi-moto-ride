name: Cadastro — admin exige e-mail confirmado

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/auth-status.server.ts"
      - "src/lib/perfil.functions.ts"
      - "scripts/cadastro/admin-exige-email-confirmado.test.ts"
      - ".github/workflows/cadastro-admin-email-confirmado.yml"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: cadastro-admin-email-confirmado-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admin-exige-email-confirmado:
    name: Travar exigência de e-mail confirmado nas checagens de admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Instalar Bun fixado
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Instalar dependências sem alterar o lockfile
        run: bun install --frozen-lockfile

      - name: Executar teste de regressão
        run: bun scripts/cadastro/admin-exige-email-confirmado.test.ts
