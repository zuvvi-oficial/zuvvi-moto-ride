name: Cadastro — aceite de Termos e Privacidade (LGPD)

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/auth-google.functions.ts"
      - "src/lib/legal-versions.ts"
      - "src/routes/auth.completar-cadastro.tsx"
      - "supabase/migrations/20260913120000_lgpd_registro_aceite_termos.sql"
      - "scripts/cadastro/aceite-termos-lgpd.test.ts"
      - ".github/workflows/cadastro-aceite-termos-lgpd.yml"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: cadastro-aceite-termos-lgpd-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  aceite-termos-lgpd:
    name: Travar aceite obrigatório de Termos e Privacidade no cadastro
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Instalar Bun fixado
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Instalar dependências sem alterar o lockfile
        run: bun install --frozen-lockfile

      - name: Executar teste de regressão
        run: bun scripts/cadastro/aceite-termos-lgpd.test.ts
