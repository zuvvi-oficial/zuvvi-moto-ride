name: Perfil — exportação de dados (LGPD)

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/exportacao-dados.functions.ts"
      - "src/components/perfil/BaixarMeusDadosButton.tsx"
      - "src/routes/perfil.tsx"
      - "src/routes/perfil-motorista.tsx"
      - "scripts/cadastro/exportacao-dados-lgpd.test.ts"
      - ".github/workflows/perfil-exportacao-dados-lgpd.yml"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: perfil-exportacao-dados-lgpd-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exportacao-dados-lgpd:
    name: Travar exportação de dados (portabilidade LGPD)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Instalar Bun fixado
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Instalar dependências sem alterar o lockfile
        run: bun install --frozen-lockfile

      - name: Executar teste de regressão
        run: bun scripts/cadastro/exportacao-dados-lgpd.test.ts
