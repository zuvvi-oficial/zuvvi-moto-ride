name: Supabase Local Migrations Check

on:
  push:
    paths:
      - '.github/workflows/supabase-local-migrations-check.yml'
      - 'supabase/migrations/**'
      - 'src/integrations/supabase/types.ts'
  workflow_dispatch:

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Supabase CLI version
        run: npx supabase@2.111.0 --version

      - name: Start Supabase Local Environment
        run: npx supabase@2.111.0 start

      - name: Run Full Database Reset (Local Only)
        run: npx supabase@2.111.0 db reset --local

      - name: Instalar Bun fixado
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Instalar dependências sem alterar o lockfile
        run: bun install --frozen-lockfile

      # ZV 03 (plano de fechamento): evita CI verde com banco incompatível —
      # gera os tipos a partir do schema local recém-recriado pelas 114
      # migrations e compara com o arquivo versionado. O arquivo temporário
      # fica dentro do repositório (não em /tmp) para o Prettier resolver o
      # .prettierrc do projeto (printWidth 100); sem isso o diff sempre
      # acusaria divergência só de quebra de linha, não de schema de verdade.
      # "--ignore-path .prettierignore" é necessário porque o próprio nome
      # deste arquivo temporário está no .gitignore (para não ser commitado
      # por engano se alguém rodar isso localmente) — sem essa flag, o
      # Prettier 3 respeita .gitignore por padrão e pularia a formatação
      # silenciosamente, fazendo o diff abaixo sempre acusar divergência.
      # A comparação em si roda por scripts/ci/comparar-tipos-supabase.mjs
      # em vez de "diff" puro: "--local" (usado aqui) e a API hospedada
      # (usada para gerar o arquivo versionado) produzem metadados de
      # geração diferentes que não refletem o schema real — ver o comentário
      # no topo daquele script para o porquê exato.
      - name: Gerar tipos TypeScript do schema local e comparar com o versionado
        run: |
          set -euo pipefail
          npx supabase@2.111.0 gen types typescript --local > src/integrations/supabase/types.generated.ts
          bunx prettier --ignore-path .prettierignore --write src/integrations/supabase/types.generated.ts
          node scripts/ci/comparar-tipos-supabase.mjs src/integrations/supabase/types.generated.ts src/integrations/supabase/types.ts
          rm -f src/integrations/supabase/types.generated.ts

      - name: Stop Supabase
        if: always()
        run: npx supabase@2.111.0 stop --no-backup || true

      - name: Publish workflow run locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE="$JOB_STATUS"
          if [ "$STATE" = "cancelled" ]; then
            STATE="error"
          fi


          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "$(jq -n \
              --arg state "$STATE" \
              --arg url "$RUN_URL" \
              '{
                state: $state,
                target_url: $url,
                description: "Supabase local migrations check",
                context: "zuvvi/supabase-local-migrations"
              }')"
