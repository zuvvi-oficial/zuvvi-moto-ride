name: PIX Pagamento passageiro

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/pagamento-pix.tsx"
      - "src/lib/pagamento-pix-status.functions.ts"
      - "src/routes/procurando-motorista.tsx"
      - "src/routeTree.gen.ts"
      - "scripts/pix/pagamento-pix.test.ts"
      - ".github/workflows/pix-pagamento-passageiro.yml"
      - "package.json"
      - "bun.lock"

# TEMPORÁRIO somente enquanto Bun/Router geram bun.lock + routeTree permitidos.
# Após o primeiro commit gerado, volta obrigatoriamente para contents: read.
permissions:
  contents: write

jobs:
  pagamento-passageiro:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/pix-100-seguro'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout da branch Pix
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/pix-100-seguro
          fetch-depth: 1

      - name: Instalar Bun fixado
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Gerar somente lockfile e rota autorizados
        shell: bash
        run: |
          set -euo pipefail
          bun install
          bun run build

          changed="$(git diff --name-only | sort)"
          allowed="$(printf '%s\n' 'bun.lock' 'src/routeTree.gen.ts' | sort)"
          if [ "$changed" != "$allowed" ]; then
            echo "Arquivos gerados inesperados:"
            printf '%s\n' "$changed"
            exit 1
          fi

          deleted_lock_lines="$(git diff --unified=0 -- bun.lock | grep '^-' | grep -v '^---' || true)"
          unexpected_lock_adds="$(git diff --unified=0 -- bun.lock | grep '^+' | grep -v '^+++' | grep -v 'qrcode.react' | grep -v '^+$' || true)"
          if [ -n "$deleted_lock_lines" ] || [ -n "$unexpected_lock_adds" ]; then
            echo "bun.lock mudou além da dependência qrcode.react. Abortando."
            git diff -- bun.lock
            exit 1
          fi

          grep -q 'qrcode.react' bun.lock
          route_diff="$(git diff --unified=0 -- src/routeTree.gen.ts)"
          if printf '%s\n' "$route_diff" | grep '^+' | grep -v '^+++' | grep -v 'PagamentoPix' | grep -v "pagamento-pix" | grep -v '^+$' >/dev/null; then
            echo "routeTree recebeu conteúdo não relacionado à nova rota Pix. Abortando."
            printf '%s\n' "$route_diff"
            exit 1
          fi

      - name: Commitar somente arquivos gerados autorizados
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock src/routeTree.gen.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock src/routeTree.gen.ts
          git commit -m "build(pix): gerar lock e rota da tela de pagamento"
          git push origin HEAD:feature/pix-100-seguro

      - name: Instalar dependências com lock congelado
        run: bun install --frozen-lockfile

      - name: Executar testes exclusivos da Etapa 5
        run: bun scripts/pix/pagamento-pix.test.ts

      - name: Verificar ESLint somente no escopo da Etapa 5
        run: >-
          bunx eslint
          src/routes/pagamento-pix.tsx
          src/lib/pagamento-pix-status.functions.ts
          src/routes/procurando-motorista.tsx
          scripts/pix/pagamento-pix.test.ts

      - name: Verificar TypeScript integral
        run: bunx tsc --noEmit

      - name: Executar build de produção
        run: bun run build

      - name: Provar isolamento e regras Pix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QRCodeSVG' src/routes/pagamento-pix.tsx
          grep -q 'useOnlineStatus' src/routes/pagamento-pix.tsx
          grep -q 'Já paguei' src/routes/pagamento-pix.tsx
          grep -q "to: '/pagamento-pix'" src/routes/procurando-motorista.tsx
          grep -q "to: '/acompanhamento'" src/routes/procurando-motorista.tsx
          grep -q "formaPagamento === 'pix'" src/routes/procurando-motorista.tsx
          grep -q 'pagamento.status === "pago"' src/lib/pagamento-pix-status.functions.ts
          ! grep -q 'pagamentos_pix_tentativas' src/routes/pagamento-pix.tsx
          ! grep -Eq 'MERCADOPAGO_CLIENT_SECRET|PIX_OAUTH_ENCRYPTION_KEY|SUPABASE_SERVICE_ROLE_KEY' src/routes/pagamento-pix.tsx
          node -e "const p=require('./package.json'); if(p.dependencies['qrcode.react']!=='4.2.0') process.exit(1)"
