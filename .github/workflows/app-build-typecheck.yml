name: App Build & TypeScript

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: app-build-typecheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: Build (Vite) e checagem estrita de TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Instalar Bun fixado
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Instalar dependências sem alterar o lockfile
        run: bun install --frozen-lockfile

      - name: Build (vite build)
        run: bun run build

      - name: Checagem estrita de TypeScript (tsc --noEmit)
        run: bunx tsc --noEmit
