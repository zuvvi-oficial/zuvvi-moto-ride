name: PIX Criação Financeira Atômica

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pix-criacao-financeira-atomica.yml"
      - "supabase/migrations/*_criacao_financeira_atomica.sql"
      - "src/lib/user.functions.ts"
      - "scripts/pix/criacao-financeira-atomica.test.ts"

permissions:
  contents: read

concurrency:
  group: pix-criacao-financeira-atomica-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  etapa-3-criacao-financeira-atomica:
    name: Testar atomicidade, idempotência e regressão
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_CLI_VERSION: 2.115.0
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - name: Checkout da branch do Pix
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Instalar Bun fixado
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Instalar dependências sem alterar o lockfile
        run: bun install --frozen-lockfile

      - name: Preparar migration da Etapa 3
        shell: bash
        run: |
          set -euo pipefail
          migration_path="$(find supabase/migrations -maxdepth 1 -type f -name '*_criacao_financeira_atomica.sql' -print -quit)"
          if [ -z "${migration_path}" ]; then
            npx --yes supabase@${SUPABASE_CLI_VERSION} migration new criacao_financeira_atomica
            migration_path="$(find supabase/migrations -maxdepth 1 -type f -name '*_criacao_financeira_atomica.sql' -print -quit)"
            echo "MIGRATION_GENERATED=${migration_path}"
            cat > "${migration_path}" <<'SQL'
          do $$
          begin
            if exists (
              select 1
              from public.pagamentos
              group by corrida_id
              having count(*) > 1
            ) then
              raise exception using
                errcode = '23505',
                message = 'ETAPA3_PAGAMENTO_AGREGADO_DUPLICADO';
            end if;
          end
          $$;

          create unique index pagamentos_corrida_unique_idx
            on public.pagamentos (corrida_id);

          create or replace function public.criar_corrida_financeira_atomica(
            p_passageiro_id uuid,
            p_cidade_id uuid,
            p_origem_lat numeric,
            p_origem_lng numeric,
            p_destino_lat numeric,
            p_destino_lng numeric,
            p_valor_estimado numeric,
            p_forma_pagamento public.forma_pagamento,
            p_codigo_embarque text,
            p_origem_nome text,
            p_destino_nome text,
            p_valor_total numeric,
            p_valor_motorista numeric,
            p_valor_comissao numeric
          )
          returns uuid
          language plpgsql
          security invoker
          set search_path = ''
          as $$
          declare
            v_corrida_id uuid;
            v_corrida_existente record;
          begin
            perform pg_advisory_xact_lock(
              hashtextextended('zuvvi:create-ride:' || p_passageiro_id::text, 0)
            );

            select c.id,
                   c.origem_lat,
                   c.origem_lng,
                   c.destino_lat,
                   c.destino_lng,
                   c.valor_estimado,
                   c.forma_pagamento,
                   c.created_at
              into v_corrida_existente
              from public.corridas c
             where c.passageiro_id = p_passageiro_id
               and c.status in (
                 'solicitada'::public.corrida_status,
                 'buscando_motorista'::public.corrida_status,
                 'aceita'::public.corrida_status,
                 'motorista_a_caminho'::public.corrida_status,
                 'motorista_chegou'::public.corrida_status,
                 'em_andamento'::public.corrida_status
               )
             order by c.created_at desc
             limit 1;

            if found then
              if v_corrida_existente.created_at >= now() - interval '2 minutes'
                 and v_corrida_existente.origem_lat = p_origem_lat
                 and v_corrida_existente.origem_lng = p_origem_lng
                 and v_corrida_existente.destino_lat = p_destino_lat
                 and v_corrida_existente.destino_lng = p_destino_lng
                 and v_corrida_existente.valor_estimado = p_valor_estimado
                 and v_corrida_existente.forma_pagamento = p_forma_pagamento
                 and exists (
                   select 1
                     from public.pagamentos p
                    where p.corrida_id = v_corrida_existente.id
                 ) then
                return v_corrida_existente.id;
              end if;

              raise exception using
                errcode = '23505',
                message = 'ETAPA3_PASSAGEIRO_JA_POSSUI_CORRIDA_ATIVA';
            end if;

            insert into public.corridas (
              passageiro_id,
              cidade_id,
              origem_lat,
              origem_lng,
              destino_lat,
              destino_lng,
              valor_estimado,
              forma_pagamento,
              codigo_embarque,
              status,
              origem_nome,
              destino_nome
            ) values (
              p_passageiro_id,
              p_cidade_id,
              p_origem_lat,
              p_origem_lng,
              p_destino_lat,
              p_destino_lng,
              p_valor_estimado,
              p_forma_pagamento,
              p_codigo_embarque,
              'solicitada'::public.corrida_status,
              p_origem_nome,
              p_destino_nome
            )
            returning id into v_corrida_id;

            insert into public.pagamentos (
              corrida_id,
              meio,
              valor_total,
              valor_motorista,
              valor_comissao,
              status
            ) values (
              v_corrida_id,
              p_forma_pagamento,
              p_valor_total,
              p_valor_motorista,
              p_valor_comissao,
              'pendente'::public.pagamento_status
            );

            return v_corrida_id;
          end;
          $$;

          revoke execute on function public.criar_corrida_financeira_atomica(
            uuid, uuid, numeric, numeric, numeric, numeric, numeric,
            public.forma_pagamento, text, text, text, numeric, numeric, numeric
          ) from public, anon, authenticated;

          grant execute on function public.criar_corrida_financeira_atomica(
            uuid, uuid, numeric, numeric, numeric, numeric, numeric,
            public.forma_pagamento, text, text, text, numeric, numeric, numeric
          ) to service_role;
          SQL
          else
            echo "MIGRATION_VERSIONED=${migration_path}"
          fi
          test -n "${migration_path}"
          cp "${migration_path}" /tmp/etapa3.sql

      - name: Isolar migrations preexistentes no runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zuvvi_migrations_preexistentes
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' \
            -exec mv {} /tmp/zuvvi_migrations_preexistentes/ \;

      - name: Iniciar Supabase local descartável
        run: >-
          npx --yes supabase@${SUPABASE_CLI_VERSION} start
          --exclude studio,imgproxy,mailpit,logflare,vector,edge-runtime

      - name: Criar fixture mínima equivalente ao core financeiro
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 <<'SQL'
          create type public.corrida_status as enum (
            'solicitada','buscando_motorista','aceita','motorista_a_caminho',
            'motorista_chegou','em_andamento','concluida','cancelada','sem_motorista'
          );
          create type public.forma_pagamento as enum ('pix','cartao','dinheiro');
          create type public.pagamento_status as enum ('pendente','pago','falhou','estornado');

          create table public.corridas (
            id uuid primary key default gen_random_uuid(),
            passageiro_id uuid not null,
            motorista_id uuid,
            cidade_id uuid not null,
            origem_lat numeric not null,
            origem_lng numeric not null,
            destino_lat numeric not null,
            destino_lng numeric not null,
            status public.corrida_status not null default 'solicitada',
            valor_estimado numeric not null,
            valor_final numeric,
            forma_pagamento public.forma_pagamento not null,
            codigo_embarque char(4) not null,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            origem_nome text,
            destino_nome text
          );

          create unique index idx_corridas_passageiro_aberta_unique
            on public.corridas (passageiro_id)
            where status in (
              'solicitada','buscando_motorista','aceita','motorista_a_caminho',
              'motorista_chegou','em_andamento'
            );

          create table public.pagamentos (
            id uuid primary key default gen_random_uuid(),
            corrida_id uuid not null references public.corridas(id) on delete cascade,
            meio public.forma_pagamento not null,
            valor_total numeric not null check (valor_total >= 0),
            valor_motorista numeric not null check (valor_motorista >= 0),
            valor_comissao numeric not null check (valor_comissao >= 0),
            status public.pagamento_status not null default 'pendente',
            id_transacao_mercadopago text,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );
          SQL

      - name: Aplicar migration atômica
        run: psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/etapa3.sql

      - name: Provar criação normal e duplo toque idempotente
        shell: bash
        run: |
          set -euo pipefail
          passageiro="11111111-1111-4111-8111-111111111111"
          cidade="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
          first="$(psql "${LOCAL_DB_URL}" -Atc "select public.criar_corrida_financeira_atomica('${passageiro}','${cidade}',-23.31,-51.17,-23.30,-51.16,18.50,'pix','1234','Origem','Destino',18.50,14.80,3.70)")"
          second="$(psql "${LOCAL_DB_URL}" -Atc "select public.criar_corrida_financeira_atomica('${passageiro}','${cidade}',-23.31,-51.17,-23.30,-51.16,18.50,'pix','9876','Origem','Destino',18.50,14.80,3.70)")"
          test "${first}" = "${second}"
          test "$(psql "${LOCAL_DB_URL}" -Atc "select count(*) from public.corridas where passageiro_id='${passageiro}'")" = "1"
          test "$(psql "${LOCAL_DB_URL}" -Atc "select count(*) from public.pagamentos p join public.corridas c on c.id=p.corrida_id where c.passageiro_id='${passageiro}'")" = "1"
          echo "DUPLO_TOQUE_OK ride_id=${first} corridas=1 pagamentos=1"

      - name: Provar rollback integral quando pagamento falha
        shell: bash
        run: |
          set -euo pipefail
          passageiro="22222222-2222-4222-8222-222222222222"
          cidade="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
          if psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -c "select public.criar_corrida_financeira_atomica('${passageiro}','${cidade}',-23.31,-51.17,-23.30,-51.16,20.00,'pix','4321','Origem','Destino',-1.00,16.00,4.00)" > /tmp/etapa3_falha.log 2>&1; then
            echo "A criação deveria ter falhado no pagamento"
            exit 1
          fi
          test "$(psql "${LOCAL_DB_URL}" -Atc "select count(*) from public.corridas where passageiro_id='${passageiro}'")" = "0"
          test "$(psql "${LOCAL_DB_URL}" -Atc "select count(*) from public.pagamentos p join public.corridas c on c.id=p.corrida_id where c.passageiro_id='${passageiro}'")" = "0"
          echo "FALHA_PAGAMENTO_ROLLBACK_OK corridas=0 pagamentos=0"

      - name: Provar regressão de dinheiro e cartão
        shell: bash
        run: |
          set -euo pipefail
          cidade="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
          dinheiro="33333333-3333-4333-8333-333333333333"
          cartao="44444444-4444-4444-8444-444444444444"
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -Atc "select public.criar_corrida_financeira_atomica('${dinheiro}','${cidade}',-23.31,-51.17,-23.30,-51.16,15.00,'dinheiro','1111','Origem','Destino',15.00,12.00,3.00)" >/dev/null
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -Atc "select public.criar_corrida_financeira_atomica('${cartao}','${cidade}',-23.31,-51.17,-23.30,-51.16,25.00,'cartao','2222','Origem','Destino',25.00,20.00,5.00)" >/dev/null
          test "$(psql "${LOCAL_DB_URL}" -Atc "select count(*) from public.corridas where passageiro_id in ('${dinheiro}','${cartao}')")" = "2"
          test "$(psql "${LOCAL_DB_URL}" -Atc "select count(*) from public.pagamentos where meio='dinheiro'")" = "1"
          test "$(psql "${LOCAL_DB_URL}" -Atc "select count(*) from public.pagamentos where meio='cartao'")" = "1"
          echo "REGRESSAO_DINHEIRO_CARTAO_OK"

      - name: Provar unicidade do pagamento agregado
        shell: bash
        run: |
          set -euo pipefail
          corrida_id="$(psql "${LOCAL_DB_URL}" -Atc "select id from public.corridas limit 1")"
          if psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -c "insert into public.pagamentos(corrida_id,meio,valor_total,valor_motorista,valor_comissao,status) values ('${corrida_id}','pix',1,1,0,'pendente')" > /tmp/etapa3_dup_pagamento.log 2>&1; then
            echo "Pagamento agregado duplicado deveria ser bloqueado"
            exit 1
          fi
          grep -q "pagamentos_corrida_unique_idx" /tmp/etapa3_dup_pagamento.log
          echo "PAGAMENTO_AGREGADO_UNICO_OK"

      - name: Provar grants mínimos da RPC
        shell: bash
        run: |
          set -euo pipefail
          assinatura="public.criar_corrida_financeira_atomica(uuid,uuid,numeric,numeric,numeric,numeric,numeric,public.forma_pagamento,text,text,text,numeric,numeric,numeric)"
          test "$(psql "${LOCAL_DB_URL}" -Atc "select has_function_privilege('anon','${assinatura}','EXECUTE')")" = "f"
          test "$(psql "${LOCAL_DB_URL}" -Atc "select has_function_privilege('authenticated','${assinatura}','EXECUTE')")" = "f"
          test "$(psql "${LOCAL_DB_URL}" -Atc "select has_function_privilege('service_role','${assinatura}','EXECUTE')")" = "t"
          echo "GRANTS_RPC_OK"

      - name: Executar teste estático exclusivo da Etapa 3
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/pix/criacao-financeira-atomica.test.ts ]; then
            bun scripts/pix/criacao-financeira-atomica.test.ts
          else
            echo "TESTE_ESTATICO_AINDA_NAO_VERSIONADO"
          fi

      - name: Verificar TypeScript integral
        run: bunx tsc --noEmit

      - name: Executar build de produção
        run: bun run build

      - name: Descartar stack local
        if: always()
        run: npx --yes supabase@${SUPABASE_CLI_VERSION} stop --no-backup
