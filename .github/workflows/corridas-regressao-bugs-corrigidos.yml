name: Corridas — regressão de bugs corrigidos

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/user.functions.ts"
      - "src/lib/motorista.functions.ts"
      - "scripts/corridas/regressao-bugs-corrigidos.test.ts"
      - ".github/workflows/corridas-regressao-bugs-corrigidos.yml"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: corridas-regressao-bugs-corrigidos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regressao-bugs-corrigidos:
    name: Travar G1, G5 e G7 (cancelamento, reaprovação de veículo, código de embarque)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Instalar Bun fixado
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Instalar dependências sem alterar o lockfile
        run: bun install --frozen-lockfile

      - name: Executar teste de regressão
        run: bun scripts/corridas/regressao-bugs-corrigidos.test.ts
