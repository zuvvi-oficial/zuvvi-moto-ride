name: Quality and Security Check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reject tracked environment files
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must never be tracked."
            exit 1
          fi

          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env\.' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo "::error::Environment files must not be tracked:"
            echo "$tracked_env_files"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
