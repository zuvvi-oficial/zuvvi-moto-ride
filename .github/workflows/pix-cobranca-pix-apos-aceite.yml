name: PIX Cobrança após aceite

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pix-cobranca-pix-apos-aceite.yml"
      - "src/lib/pagamento.server.ts"
      - "src/lib/motorista.functions.ts"
      - "supabase/migrations/20260825092700_pix_cobranca_apos_aceite.sql"
      - "scripts/pix/cobranca-pix-apos-aceite.test.ts"

permissions:
  contents: read

concurrency:
  group: pix-cobranca-apos-aceite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  etapa-4-cobranca-pix:
    name: Testar OAuth, split e idempotência
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_CLI_VERSION: 2.115.0
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - name: Checkout da branch do Pix
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Instalar Bun fixado
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Instalar dependências sem alterar lockfile
        run: bun install --frozen-lockfile

      - name: Preservar somente migrations necessárias ao teste
        shell: bash
        run: |
          set -euo pipefail
          cp supabase/migrations/20260824233357_pix_oauth_credentials_private.sql /tmp/pix01.sql
          cp supabase/migrations/20260824234933_pix_attempts_webhook.sql /tmp/pix02.sql
          cp supabase/migrations/20260825021917_pix_oauth_atomic_connection.sql /tmp/pix-oauth-atomic.sql
          cp supabase/migrations/20260825092700_pix_cobranca_apos_aceite.sql /tmp/etapa4.sql
          mkdir -p /tmp/zuvvi_migrations_preexistentes
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' \
            -exec mv {} /tmp/zuvvi_migrations_preexistentes/ \;

      - name: Iniciar Supabase local descartável
        run: >-
          npx --yes supabase@${SUPABASE_CLI_VERSION} start
          --exclude studio,imgproxy,mailpit,logflare,vector,edge-runtime

      - name: Criar fixture mínima do aceite e agregado financeiro
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 <<'SQL'
          create type public.motorista_status_aprovacao as enum (
            'em_preenchimento','em_analise','aprovado','recusado','suspenso'
          );
          create type public.forma_pagamento as enum ('pix','cartao','dinheiro');
          create type public.corrida_status as enum (
            'solicitada','buscando_motorista','aceita','motorista_a_caminho',
            'motorista_chegou','em_andamento','concluida','cancelada','sem_motorista'
          );
          create type public.pagamento_status as enum ('pendente','pago','falhou','estornado');

          create table public.usuarios (
            id uuid primary key,
            cidade_id uuid,
            nome text,
            email text
          );

          create table public.motoristas (
            id uuid primary key references public.usuarios(id) on delete cascade,
            status_aprovacao public.motorista_status_aprovacao not null,
            is_disponivel boolean not null default false,
            conta_mercado_pago_id text,
            updated_at timestamptz not null default now()
          );

          create table public.corridas (
            id uuid primary key,
            passageiro_id uuid not null,
            motorista_id uuid references public.motoristas(id),
            cidade_id uuid not null,
            status public.corrida_status not null default 'solicitada',
            forma_pagamento public.forma_pagamento not null,
            data_aceite timestamptz,
            updated_at timestamptz not null default now()
          );

          create table public.pagamentos (
            id uuid primary key,
            corrida_id uuid not null references public.corridas(id) on delete cascade,
            meio public.forma_pagamento not null,
            valor_total numeric(10,2) not null,
            valor_motorista numeric(10,2) not null,
            valor_comissao numeric(10,2) not null,
            status public.pagamento_status not null default 'pendente',
            id_transacao_mercadopago text,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );
          SQL

      - name: Aplicar fundações Pix já versionadas e Etapa 4
        run: |
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/pix01.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/pix02.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/pix-oauth-atomic.sql
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/etapa4.sql

      - name: Provar motorista conectado e aceite Pix
        shell: bash
        run: |
          set -euo pipefail
          driver="11111111-1111-4111-8111-111111111111"
          passenger="22222222-2222-4222-8222-222222222222"
          city="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
          ride="33333333-3333-4333-8333-333333333333"
          payment="44444444-4444-4444-8444-444444444444"

          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 <<SQL
          insert into public.usuarios(id,cidade_id,nome,email)
          values ('${driver}','${city}','Motorista','motorista@example.com');
          insert into public.motoristas(id,status_aprovacao,is_disponivel,conta_mercado_pago_id)
          values ('${driver}','aprovado',true,'123456789');
          insert into private.motorista_mercadopago_credenciais(
            motorista_id,mercadopago_user_id,access_token_encrypted,refresh_token_encrypted,
            encryption_version,expires_at,connection_status
          ) values (
            '${driver}','123456789','v1.iv.access','v1.iv.refresh',1,now()+interval '1 hour','active'
          );
          insert into public.corridas(id,passageiro_id,cidade_id,forma_pagamento,status)
          values ('${ride}','${passenger}','${city}','pix','solicitada');
          insert into public.pagamentos(id,corrida_id,meio,valor_total,valor_motorista,valor_comissao,status)
          values ('${payment}','${ride}','pix',18.50,14.80,3.70,'pendente');
          select public.accept_corrida_atomic('${ride}','${driver}');
          SQL

          test "$(psql "${LOCAL_DB_URL}" -Atc "select status::text||':'||motorista_id::text from public.corridas where id='${ride}'")" = "aceita:${driver}"
          echo "MOTORISTA_CONECTADO_ACEITE_PIX_OK"

      - name: Provar motorista desconectado bloqueado
        shell: bash
        run: |
          set -euo pipefail
          driver="55555555-5555-4555-8555-555555555555"
          city="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
          ride="66666666-6666-4666-8666-666666666666"
          payment="77777777-7777-4777-8777-777777777777"
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 <<SQL
          insert into public.usuarios(id,cidade_id) values ('${driver}','${city}');
          insert into public.motoristas(id,status_aprovacao,is_disponivel,conta_mercado_pago_id)
          values ('${driver}','aprovado',true,null);
          insert into public.corridas(id,passageiro_id,cidade_id,forma_pagamento,status)
          values ('${ride}','88888888-8888-4888-8888-888888888888','${city}','pix','solicitada');
          insert into public.pagamentos(id,corrida_id,meio,valor_total,valor_motorista,valor_comissao,status)
          values ('${payment}','${ride}','pix',20.00,16.00,4.00,'pendente');
          SQL
          if psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -c "select public.accept_corrida_atomic('${ride}','${driver}')" >/tmp/desconectado.log 2>&1; then
            echo "Motorista desconectado não poderia aceitar Pix"
            exit 1
          fi
          grep -q "Conta Mercado Pago inválida" /tmp/desconectado.log
          test "$(psql "${LOCAL_DB_URL}" -Atc "select status::text from public.corridas where id='${ride}'")" = "solicitada"
          echo "MOTORISTA_DESCONECTADO_BLOQUEADO_DB_OK"

      - name: Provar token expirado bloqueado e renovado elegível
        shell: bash
        run: |
          set -euo pipefail
          driver="99999999-9999-4999-8999-999999999999"
          city="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
          ride="aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"
          payment="bbbbbbbb-cccc-4ddd-8eee-ffffffffffff"
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 <<SQL
          insert into public.usuarios(id,cidade_id) values ('${driver}','${city}');
          insert into public.motoristas(id,status_aprovacao,is_disponivel,conta_mercado_pago_id)
          values ('${driver}','aprovado',true,'987654321');
          insert into private.motorista_mercadopago_credenciais(
            motorista_id,mercadopago_user_id,access_token_encrypted,refresh_token_encrypted,
            encryption_version,expires_at,connection_status
          ) values (
            '${driver}','987654321','v1.iv.access','v1.iv.refresh',1,now()-interval '1 minute','active'
          );
          insert into public.corridas(id,passageiro_id,cidade_id,forma_pagamento,status)
          values ('${ride}','cccccccc-dddd-4eee-8fff-111111111111','${city}','pix','solicitada');
          insert into public.pagamentos(id,corrida_id,meio,valor_total,valor_motorista,valor_comissao,status)
          values ('${payment}','${ride}','pix',25.00,20.00,5.00,'pendente');
          SQL
          if psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -c "select public.accept_corrida_atomic('${ride}','${driver}')" >/tmp/expirado.log 2>&1; then
            echo "Credencial expirada não poderia passar na fronteira atômica"
            exit 1
          fi
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -c "update private.motorista_mercadopago_credenciais set expires_at=now()+interval '6 hours', updated_at=now() where motorista_id='${driver}'"
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -c "select public.accept_corrida_atomic('${ride}','${driver}')"
          test "$(psql "${LOCAL_DB_URL}" -Atc "select status::text from public.corridas where id='${ride}'")" = "aceita"
          echo "TOKEN_EXPIRADO_BLOQUEADO_E_APOS_RENOVACAO_ACEITO_DB_OK"

      - name: Provar comissão congelada e cobrança concorrente bloqueada
        shell: bash
        run: |
          set -euo pipefail
          driver="11111111-1111-4111-8111-111111111111"
          ride="33333333-3333-4333-8333-333333333333"
          first="$(psql "${LOCAL_DB_URL}" -AtF '|' -c "select tentativa_id,valor_total,valor_comissao,idempotency_key from public.pix_charge_attempt_claim('${ride}','${driver}')")"
          echo "CLAIM=${first}"
          echo "${first}" | grep -q '|18.50|3.70|zuvvi-pix-44444444-4444-4444-8444-444444444444'
          if psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -c "select * from public.pix_charge_attempt_claim('${ride}','${driver}')" >/tmp/duplicada.log 2>&1; then
            echo "Segunda cobrança concorrente deveria ser bloqueada"
            exit 1
          fi
          grep -q "ETAPA4_COBRANCA_JA_REQUISITADA" /tmp/duplicada.log
          test "$(psql "${LOCAL_DB_URL}" -Atc "select count(*) from public.pagamentos_pix_tentativas where pagamento_id='44444444-4444-4444-8444-444444444444'")" = "1"
          echo "COMISSAO_CONGELADA_E_DUPLICIDADE_BLOQUEADA_DB_OK"

      - name: Provar persistência atômica do ID Mercado Pago
        shell: bash
        run: |
          set -euo pipefail
          attempt="$(psql "${LOCAL_DB_URL}" -Atc "select id from public.pagamentos_pix_tentativas where pagamento_id='44444444-4444-4444-8444-444444444444'")"
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -c "select public.pix_charge_attempt_complete('${attempt}','MP-123456','pending','pending_waiting_payment','000201PIXTESTE',now()+interval '5 minutes')"
          test "$(psql "${LOCAL_DB_URL}" -Atc "select id_transacao_mercadopago from public.pagamentos where id='44444444-4444-4444-8444-444444444444'")" = "MP-123456"
          test "$(psql "${LOCAL_DB_URL}" -Atc "select mercadopago_payment_id||':'||estado_interno from public.pagamentos_pix_tentativas where id='${attempt}'")" = "MP-123456:pendente"
          echo "IDENTIFICADOR_EXTERNO_PERSISTIDO_ATOMICAMENTE_OK"

      - name: Provar dinheiro e cartão sem dependência Mercado Pago
        shell: bash
        run: |
          set -euo pipefail
          city="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
          money_driver="12121212-1212-4121-8121-121212121212"
          card_driver="13131313-1313-4131-8131-131313131313"
          money_ride="14141414-1414-4141-8141-141414141414"
          card_ride="15151515-1515-4151-8151-151515151515"
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 <<SQL
          insert into public.usuarios(id,cidade_id) values ('${money_driver}','${city}'),('${card_driver}','${city}');
          insert into public.motoristas(id,status_aprovacao,is_disponivel) values
            ('${money_driver}','aprovado',true),('${card_driver}','aprovado',true);
          insert into public.corridas(id,passageiro_id,cidade_id,forma_pagamento,status) values
            ('${money_ride}','16161616-1616-4161-8161-161616161616','${city}','dinheiro','solicitada'),
            ('${card_ride}','17171717-1717-4171-8171-171717171717','${city}','cartao','solicitada');
          select public.accept_corrida_atomic('${money_ride}','${money_driver}');
          select public.accept_corrida_atomic('${card_ride}','${card_driver}');
          SQL
          test "$(psql "${LOCAL_DB_URL}" -Atc "select count(*) from public.corridas where id in ('${money_ride}','${card_ride}') and status='aceita'")" = "2"
          echo "REGRESSAO_DINHEIRO_CARTAO_OK"

      - name: Executar testes TypeScript exclusivos da Etapa 4
        run: bun scripts/pix/cobranca-pix-apos-aceite.test.ts

      - name: Verificar TypeScript integral
        run: bunx tsc --noEmit

      - name: Executar build de produção
        run: bun run build

      - name: Descartar stack local
        if: always()
        run: npx --yes supabase@${SUPABASE_CLI_VERSION} stop --no-backup
