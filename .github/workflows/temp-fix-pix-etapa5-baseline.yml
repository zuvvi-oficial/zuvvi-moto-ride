name: TEMP Corrigir Contraprova Etapa 5

on:
  push:
    branches:
      - feature/pix-100-seguro
    paths:
      - ".github/workflows/temp-fix-pix-etapa5-baseline.yml"

permissions:
  contents: write

jobs:
  corrigir-contraprova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch Pix
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/pix-100-seguro
          fetch-depth: 0

      - name: Corrigir somente a prova de limpeza das dependencias
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/workflows/pix-db-oauth-atomic-connection.yml'),
              Path('.github/workflows/pix-db-mercadopago-account-uniqueness.yml'),
          ]
          old = '          test -z "$(git status --porcelain)"'
          new = '''          if ! git diff --quiet -- package.json bun.lock; then
            echo "package.json ou bun.lock foram alterados pelo runner"
            git diff -- package.json bun.lock
            exit 1
          fi'''

          for path in paths:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Marcador de falso positivo inesperado em {path}")
              text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Provar escopo e remover o workflow temporario
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'git diff --quiet -- package.json bun.lock' .github/workflows/pix-db-oauth-atomic-connection.yml
          grep -Fq 'git diff --quiet -- package.json bun.lock' .github/workflows/pix-db-mercadopago-account-uniqueness.yml
          if grep -Fq 'test -z "$(git status --porcelain)"' .github/workflows/pix-db-oauth-atomic-connection.yml; then
            echo "A prova ampla antiga permaneceu no workflow OAuth atomico"
            exit 1
          fi
          if grep -Fq 'test -z "$(git status --porcelain)"' .github/workflows/pix-db-mercadopago-account-uniqueness.yml; then
            echo "A prova ampla antiga permaneceu no workflow de unicidade"
            exit 1
          fi

          git rm .github/workflows/temp-fix-pix-etapa5-baseline.yml

          mapfile -t changed < <(git diff --name-only | sort)
          printf 'Arquivos alterados:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" = "3"
          test "${changed[0]}" = ".github/workflows/pix-db-mercadopago-account-uniqueness.yml"
          test "${changed[1]}" = ".github/workflows/pix-db-oauth-atomic-connection.yml"
          test "${changed[2]}" = ".github/workflows/temp-fix-pix-etapa5-baseline.yml"

      - name: Commitar somente a correcao da contraprova
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pix-db-oauth-atomic-connection.yml .github/workflows/pix-db-mercadopago-account-uniqueness.yml
          git add -u .github/workflows/temp-fix-pix-etapa5-baseline.yml
          git commit -m "test(pix): eliminar falso positivo da Etapa 5"
          git push origin HEAD:feature/pix-100-seguro
