name: PIX Compensação falha de cobrança

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pix-cobranca-failure-compensation.yml"
      - "docs/pix/ETAPA_4R_COMPENSACAO_FALHA_CRIACAO.md"
      - "docs/pix/sql/PIX4R_COMPENSACAO_FALHA_CRIACAO.sql.template"
      - "supabase/tests/pix_04r_compensacao_falha_criacao.sql"
      - "supabase/migrations/*_pix_charge_failure_compensation.sql"

permissions:
  contents: read

concurrency:
  group: pix-compensacao-falha-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pix-compensacao-falha:
    name: Provar compensação sem cobrança externa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_CLI_VERSION: 2.115.0
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - name: Checkout da branch Pix
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Preparar migration temporária ou versionada
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t existing < <(find supabase/migrations -maxdepth 1 -type f -name '*_pix_charge_failure_compensation.sql' | sort)
          if [ "${#existing[@]}" -gt 1 ]; then
            echo "Mais de uma migration de compensação encontrada"
            exit 1
          fi

          if [ "${#existing[@]}" -eq 0 ]; then
            npx --yes supabase@${SUPABASE_CLI_VERSION} migration new pix_charge_failure_compensation
            mapfile -t generated < <(find supabase/migrations -maxdepth 1 -type f -name '*_pix_charge_failure_compensation.sql' | sort)
            test "${#generated[@]}" = "1"
            migration_path="${generated[0]}"
            cp docs/pix/sql/PIX4R_COMPENSACAO_FALHA_CRIACAO.sql.template "${migration_path}"
            echo "MIGRATION_MODE=temporary" >> "${GITHUB_ENV}"
          else
            migration_path="${existing[0]}"
            cmp -s docs/pix/sql/PIX4R_COMPENSACAO_FALHA_CRIACAO.sql.template "${migration_path}"
            echo "MIGRATION_MODE=versioned" >> "${GITHUB_ENV}"
          fi

          echo "MIGRATION_PATH=${migration_path}" >> "${GITHUB_ENV}"
          echo "MIGRATION_PATH=${migration_path}"
          cp "${migration_path}" /tmp/pix4r.sql

          mkdir -p /tmp/zuvvi_migrations_preexistentes
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' \
            -exec mv {} /tmp/zuvvi_migrations_preexistentes/ \;

      - name: Iniciar Supabase local descartável
        run: >-
          npx --yes supabase@${SUPABASE_CLI_VERSION} start
          --exclude studio,imgproxy,mailpit,logflare,vector,edge-runtime

      - name: Criar fixture mínima da compensação
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 <<'SQL'
          create type public.motorista_status_aprovacao as enum (
            'em_preenchimento','em_analise','aprovado','recusado','suspenso'
          );
          create type public.forma_pagamento as enum ('pix','cartao','dinheiro');
          create type public.corrida_status as enum (
            'solicitada','buscando_motorista','aceita','motorista_a_caminho',
            'motorista_chegou','em_andamento','concluida','cancelada','sem_motorista'
          );
          create type public.pagamento_status as enum ('pendente','pago','falhou','estornado');
          create type public.cancelado_por as enum ('passageiro','motorista','operacao');

          create table public.usuarios (
            id uuid primary key,
            cidade_id uuid
          );

          create table public.motoristas (
            id uuid primary key references public.usuarios(id) on delete cascade,
            status_aprovacao public.motorista_status_aprovacao not null,
            is_disponivel boolean not null default false,
            updated_at timestamptz not null default now()
          );

          create table public.corridas (
            id uuid primary key,
            passageiro_id uuid not null,
            motorista_id uuid references public.motoristas(id),
            cidade_id uuid not null,
            status public.corrida_status not null,
            forma_pagamento public.forma_pagamento not null,
            data_cancelamento timestamptz,
            cancelado_por public.cancelado_por,
            motivo_cancelamento text,
            updated_at timestamptz not null default now()
          );

          create table public.pagamentos (
            id uuid primary key,
            corrida_id uuid not null references public.corridas(id) on delete cascade,
            meio public.forma_pagamento not null,
            valor_total numeric(10,2) not null,
            valor_motorista numeric(10,2) not null,
            valor_comissao numeric(10,2) not null,
            status public.pagamento_status not null default 'pendente',
            id_transacao_mercadopago text,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );

          create table public.pagamentos_pix_tentativas (
            id uuid primary key,
            pagamento_id uuid not null references public.pagamentos(id) on delete cascade,
            motorista_id uuid not null references public.motoristas(id) on delete restrict,
            idempotency_key text not null unique,
            estado_interno text not null,
            mercadopago_payment_id text unique,
            provider_status_detail text,
            valor_total numeric(10,2) not null,
            valor_comissao numeric(10,2) not null,
            failed_at timestamptz,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );
          SQL

      - name: Aplicar compensação no banco local
        run: psql "${LOCAL_DB_URL}" -v ON_ERROR_STOP=1 -f /tmp/pix4r.sql

      - name: Executar pgTAP da compensação
        run: >-
          npx --yes supabase@${SUPABASE_CLI_VERSION} test db
          supabase/tests/pix_04r_compensacao_falha_criacao.sql --local

      - name: Lint e advisors do banco local
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@${SUPABASE_CLI_VERSION} db lint --local --schema public --level error --fail-on error
          npx --yes supabase@${SUPABASE_CLI_VERSION} db advisors --local --type security
          npx --yes supabase@${SUPABASE_CLI_VERSION} db advisors --local --type performance

      - name: Provar escopo e migration gerada
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/pix4r.sql
          grep -Fq 'pix_charge_failure_compensate' /tmp/pix4r.sql
          grep -Fq 'ETAPA4_COMPENSACAO_BLOQUEADA_COBRANCA_EXTERNA' /tmp/pix4r.sql
          grep -Fq "motivo_cancelamento = 'falha_tecnica_pagamento_pix'" /tmp/pix4r.sql
          if grep -Eiq '\b(drop|truncate)\b' /tmp/pix4r.sql; then
            echo "DDL destrutivo encontrado"
            exit 1
          fi
          echo "${MIGRATION_MODE}:${MIGRATION_PATH}"

      - name: Descartar stack local
        if: always()
        run: npx --yes supabase@${SUPABASE_CLI_VERSION} stop --no-backup
