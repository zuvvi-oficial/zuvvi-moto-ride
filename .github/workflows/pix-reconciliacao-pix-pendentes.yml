name: PIX Reconciliação de tentativas pendentes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pix-reconciliacao-pendentes
  cancel-in-progress: false

jobs:
  reconciliar-pendentes:
    name: Chamar endpoint de reconciliação de tentativas Pix presas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar endpoint interno protegido por segredo
        env:
          PIX_RECONCILIACAO_CRON_SECRET: ${{ secrets.PIX_RECONCILIACAO_CRON_SECRET }}
          APP_BASE_URL: ${{ vars.PIX_APP_BASE_URL || 'https://zuvvi-moto-ride.lovable.app' }}
        run: |
          set -euo pipefail
          if [ -z "${PIX_RECONCILIACAO_CRON_SECRET:-}" ]; then
            echo "PIX_RECONCILIACAO_CRON_SECRET não configurado nos secrets do repositório. Pulando execução."
            exit 1
          fi

          http_status=$(curl -sS -o /tmp/pix-reconciliacao-response.json -w "%{http_code}" \
            -X POST "${APP_BASE_URL}/api/internal/pix-reconciliar-pendentes" \
            -H "x-cron-secret: ${PIX_RECONCILIACAO_CRON_SECRET}" \
            -H "content-type: application/json")

          echo "HTTP status: ${http_status}"
          cat /tmp/pix-reconciliacao-response.json || true

          if [ "${http_status}" -ge 300 ]; then
            exit 1
          fi
