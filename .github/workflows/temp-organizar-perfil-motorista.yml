name: TEMP Organizar Perfil Motorista

on:
  push:
    branches:
      - feature/pix-100-seguro
    paths:
      - ".github/workflows/temp-organizar-perfil-motorista.yml"

permissions:
  contents: write

jobs:
  organizar-e-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout da branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/pix-100-seguro
          fetch-depth: 0

      - name: Instalar Bun fixado
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Reorganizar somente a Home do motorista
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/routes/home-motorista.tsx")
          text = path.read_text()

          old_import = 'import MercadoPagoConnect from "@/components/motorista/MercadoPagoConnect";\n'
          if text.count(old_import) != 1:
              raise SystemExit("Import MercadoPagoConnect inesperado na Home")
          text = text.replace(old_import, "")

          old_widget = "            <MercadoPagoConnect />\n"
          if text.count(old_widget) != 1:
              raise SystemExit("Bloco MercadoPagoConnect inesperado na Home")
          text = text.replace(old_widget, "")

          old_logout = '''          <button
            className="flex flex-col items-center gap-1 text-muted-foreground hover:text-white transition-colors"
            onClick={async () => {
              await supabase.auth.signOut();
              window.location.href = "/auth/login";
            }}
          >
            <User className="w-6 h-6" />
            <span className="text-[8px] font-black uppercase tracking-widest">Sair</span>
          </button>'''
          new_profile = '''          <a
            href="/perfil-motorista"
            className="flex flex-col items-center gap-1 text-muted-foreground hover:text-white transition-colors"
            aria-label="Abrir perfil do motorista"
          >
            <User className="w-6 h-6" />
            <span className="text-[8px] font-black uppercase tracking-widest">Perfil</span>
          </a>'''
          if text.count(old_logout) != 1:
              raise SystemExit("Bloco de logout da barra inferior inesperado")
          text = text.replace(old_logout, new_profile)

          path.write_text(text)
          PY

      - name: Instalar dependencias congeladas
        run: bun install --frozen-lockfile

      - name: Verificar formato da nova tela
        run: bunx prettier --check src/routes/perfil-motorista.tsx

      - name: Verificar ESLint da nova tela
        run: bunx eslint src/routes/perfil-motorista.tsx

      - name: Verificar TypeScript integral
        run: bunx tsc --noEmit

      - name: Gerar route tree e executar build
        run: bun run build

      - name: Provar reorganizacao isolada
        shell: bash
        run: |
          set -euo pipefail
          test -f src/routes/perfil-motorista.tsx
          grep -q 'createFileRoute("/perfil-motorista")' src/routes/perfil-motorista.tsx
          grep -q 'MercadoPagoConnect' src/routes/perfil-motorista.tsx
          grep -q 'Sair da conta' src/routes/perfil-motorista.tsx
          if grep -q 'MercadoPagoConnect' src/routes/home-motorista.tsx; then
            echo "Mercado Pago ainda ficou na Home"
            exit 1
          fi
          grep -q 'href="/perfil-motorista"' src/routes/home-motorista.tsx
          grep -q '>Perfil</span>' src/routes/home-motorista.tsx
          if grep -q '>Sair</span>' src/routes/home-motorista.tsx; then
            echo "Logout direto ainda existe na barra inferior"
            exit 1
          fi
          grep -q '/perfil-motorista' src/routeTree.gen.ts

          mapfile -t changed < <(git diff --name-only)
          printf 'Arquivos alterados pelo runner:\n%s\n' "${changed[*]}"
          for file in "${changed[@]}"; do
            case "$file" in
              src/routes/home-motorista.tsx|src/routeTree.gen.ts) ;;
              *) echo "Arquivo fora da allowlist alterado pelo runner: $file"; exit 1 ;;
            esac
          done

      - name: Commitar somente Home e route tree gerada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/home-motorista.tsx src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para commitar"
            exit 0
          fi
          git commit -m "feat(motorista): mover Mercado Pago e logout para perfil"
          git push origin HEAD:feature/pix-100-seguro
